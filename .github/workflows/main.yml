# ================================================================
# .github/workflows/build-ios-arm64e.yml
# ================================================================
# Build SEP Scanner para iOS ARM64e (A15)
# SEM BARRAS INVERTIDAS - 100% compatível
# ================================================================

name: Build iOS SEP Scanner (ARM64e)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64e:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      run: |
        sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
        echo "Xcode: $(xcodebuild -version | head -1)"
        echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
    
    - name: Compile ARM64e
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        
        echo "🔨 Compilando ARM64e..."
        echo "SDK: $SDK"
        
        clang -arch arm64e \
              -isysroot $SDK \
              -miphoneos-version-min=14.0 \
              -framework Foundation \
              -framework UIKit \
              -framework IOKit \
              -framework CoreFoundation \
              -fobjc-arc \
              -O3 \
              -o SEPScanner_arm64e \
              ViewController.m AppDelegate.m main.m
        
        echo "✅ Build completo!"
        file SEPScanner_arm64e
        
        mkdir -p SEPScanner_arm64e.app
        cp SEPScanner_arm64e SEPScanner_arm64e.app/
        zip -r SEPScanner_arm64e.ipa SEPScanner_arm64e.app
        
        ls -la SEPScanner_arm64e*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SEPScanner-ARM64e
        path: |
          SEPScanner_arm64e
          SEPScanner_arm64e.ipa
        retention-days: 7
