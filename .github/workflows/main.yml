- name: Compile for ARM64e (A15 with PAC)
  run: |
    SDK=$SDK_PATH
    
    echo "🔨 Compilando para ARM64e (A15 com PAC)..."
    echo "📦 SDK: $SDK"
    echo "🔧 Clang: $(clang --version | head -1)"
    
    # ================================================================
    # FLAGS CORRIGIDAS - SEM CONFLITO PAC
    # ================================================================
    
    CFLAGS="-arch arm64e \
            -march=armv8.5-a+crypto+fp16+dotprod+rcpc+fp16fml+sha2 \
            -mtune=apple-a15 \
            -miphoneos-version-min=14.0 \
            -isysroot $SDK \
            -fobjc-arc \
            -fblocks \
            -fmodules \
            -fPIC \
            -fPIE \
            -fstack-protector-strong \
            -fno-omit-frame-pointer \
            -fno-strict-aliasing \
            -O3 \
            -Wall \
            -Wextra \
            -Wno-deprecated-declarations \
            -Wno-unused-parameter \
            -Wno-objc-interface-ivars \
            -D__IPHONE_OS_VERSION_MIN_REQUIRED=140000 \
            -D__ARM64_ARCH_8_5__ \
            -D__ARM_FEATURE_CRYPTO=1 \
            -D__ARM_FEATURE_SHA2=1 \
            -D__ARM_FEATURE_FP16=1"
    
    # ================================================================
    # PAC FLAGS - REMOVIDO CONFLITO COM -fptrauth-returns
    # ================================================================
    
    PAC_FLAGS="-msign-return-address=all \
               -D__ARM_FEATURE_PAC_DEFAULT=3"
    
    # Tentativa com -mbranch-protection (se suportado)
    # Se falhar, usamos apenas -msign-return-address
    if clang $CFLAGS $PAC_FLAGS -mbranch-protection=bti+pac-ret -E - < /dev/null > /dev/null 2>&1; then
      echo "  ✅ -mbranch-protection suportado"
      PAC_FLAGS="$PAC_FLAGS -mbranch-protection=bti+pac-ret"
    else
      echo "  ⚠️ -mbranch-protection não suportado, usando apenas PAC"
    fi
    
    # ================================================================
    # LDFLAGS SEM CONFLITO
    # ================================================================
    
    LDFLAGS="-arch arm64e \
             -miphoneos-version-min=14.0 \
             -isysroot $SDK \
             -framework Foundation \
             -framework UIKit \
             -framework CoreGraphics \
             -framework IOKit \
             -framework CoreFoundation \
             -lobjc \
             -lc++ \
             -lSystem \
             -Wl,-no_adhoc_codesign \
             -Wl,-S \
             -Wl,-x"
    
    # ================================================================
    # COMPILAÇÃO
    # ================================================================
    
    echo "📝 Compilando ViewController.m..."
    clang $CFLAGS $PAC_FLAGS -c ViewController.m -o ViewController.o
    
    echo "📝 Compilando AppDelegate.m..."
    clang $CFLAGS $PAC_FLAGS -c AppDelegate.m -o AppDelegate.o
    
    echo "📝 Compilando main.m..."
    clang $CFLAGS $PAC_FLAGS -c main.m -o main.o
    
    echo "🔗 Linkando executável ARM64e..."
    clang $LDFLAGS \
          ViewController.o \
          AppDelegate.o \
          main.o \
          -o SEPScanner_arm64e
    
    # ================================================================
    # VERIFICAÇÃO
    # ================================================================
    
    echo ""
    echo "🔍 Verificando binário..."
    file SEPScanner_arm64e
    
    if command -v lipo &> /dev/null; then
      lipo -info SEPScanner_arm64e || echo "  lipo não disponível"
    fi
    
    echo ""
    echo "🔐 Verificando PAC (Pointer Authentication)..."
    if command -v otool &> /dev/null; then
      if otool -l SEPScanner_arm64e 2>/dev/null | grep -q "ptrauth"; then
        echo "  ✅ PAC detectado!"
        otool -l SEPScanner_arm64e 2>/dev/null | grep -A3 "ptrauth" | head -10
      else
        echo "  ⚠️ PAC não detectado via otool (pode ser normal em alguns SDKs)"
      fi
    else
      echo "  ⚠️ otool não disponível"
    fi
    
    # ================================================================
    # ASSINATURA
    # ================================================================
    
    echo ""
    echo "✍️ Assinando ad-hoc..."
    if command -v codesign &> /dev/null; then
      codesign -f -s - \
               --timestamp=none \
               SEPScanner_arm64e || echo "  ⚠️ Assinatura falhou (ignorando)"
    else
      echo "  ⚠️ codesign não disponível"
    fi
    
    # ================================================================
    # EMPACOTAMENTO
    # ================================================================
    
    echo ""
    echo "📦 Empacotando..."
    mkdir -p SEPScanner_arm64e.app
    cp SEPScanner_arm64e SEPScanner_arm64e.app/
    
    cat > SEPScanner_arm64e.app/Info.plist << 'EOF'
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>CFBundleDevelopmentRegion</key>
        <string>en</string>
        <key>CFBundleExecutable</key>
        <string>SEPScanner_arm64e</string>
        <key>CFBundleIdentifier</key>
        <string>com.catshadow.sepscanner.arm64e</string>
        <key>CFBundleInfoDictionaryVersion</key>
        <string>6.0</string>
        <key>CFBundleName</key>
        <string>SEPScanner ARM64e</string>
        <key>CFBundlePackageType</key>
        <string>APPL</string>
        <key>CFBundleShortVersionString</key>
        <string>1.0</string>
        <key>CFBundleVersion</key>
        <string>1</string>
        <key>LSRequiresIPhoneOS</key>
        <true/>
        <key>UIRequiredDeviceCapabilities</key>
        <array>
            <string>arm64</string>
        </array>
        <key>UIRequiresFullScreen</key>
        <true/>
        <key>UISupportedInterfaceOrientations</key>
        <array>
            <string>UIInterfaceOrientationPortrait</string>
        </array>
    </dict>
    </plist>
    EOF
    
    zip -r SEPScanner_arm64e.ipa SEPScanner_arm64e.app
    
    # ================================================================
    # RELATÓRIO
    # ================================================================
    
    echo ""
    echo "✅ Build ARM64e completo!"
    echo ""
    echo "📊 Relatório do binário:"
    echo "  - Arquitetura: $(file SEPScanner_arm64e | grep -o 'arm64e' || echo 'arm64')"
    echo "  - Tamanho: $(du -h SEPScanner_arm64e | cut -f1)"
    echo "  - PAC: $(otool -l SEPScanner_arm64e 2>/dev/null | grep -o 'ptrauth' | head -1 || echo 'não detectado')"
    echo ""
    echo "📦 Artefatos:"
    ls -la SEPScanner_arm64e*
    
  shell: /bin/bash -e {0}
  env:
    SDK_PATH: /Applications/Xcode_26.6.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS26.5.sdk
